name: Package frontend UI

on:
  push:
    branches:
      - ui-redesign-modern

jobs:
  package-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create frontend zip
        run: zip -r checkpoint-frontend-modern-ui.zip checkpoint-frontend -x "checkpoint-frontend/node_modules/*" "checkpoint-frontend/dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-frontend-modern-ui
          path: checkpoint-frontend-modern-ui.zip
