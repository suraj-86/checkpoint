spring:
  application:
    name: checkpoint-backend

  datasource:
    url: jdbc:postgresql://localhost:5434/checkpoint_dev
    username: checkpoint_user
    password: devpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

checkpoint:
  jwt:
    secret: ${CHECKPOINT_JWT_SECRET:dev-only-secret-key-change-me-please-this-is-not-secure-enough-for-prod-1234567890}
    expiration-ms: 86400000
  admin:
    username: ${CHECKPOINT_ADMIN_USERNAME:admin}
    email: ${CHECKPOINT_ADMIN_EMAIL:admin@checkpoint.local}
    password: ${CHECKPOINT_ADMIN_PASSWORD:admin123}

logging:
  level:
    com.checkpoint: DEBUG
    org.hibernate.SQL: DEBUG
