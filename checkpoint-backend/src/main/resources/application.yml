spring:
  application:
    name: checkpoint-backend

  datasource:
    url: ${CHECKPOINT_DB_URL:jdbc:postgresql://localhost:5434/checkpoint_dev}
    username: ${CHECKPOINT_DB_USER:checkpoint_user}
    password: ${CHECKPOINT_DB_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${CHECKPOINT_DB_POOL_SIZE:5}
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 600000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

checkpoint:
  cors:
    allowed-origins: ${CHECKPOINT_CORS_ORIGINS:http://localhost:5180}
  jwt:
    secret: ${CHECKPOINT_JWT_SECRET:dev-only-secret-key-change-me-please-this-is-not-secure-enough-for-prod-1234567890}
    expiration-ms: 86400000
  account:
    username-change-cooldown-days: ${CHECKPOINT_USERNAME_COOLDOWN_DAYS:7}
  admin:
    username: ${CHECKPOINT_ADMIN_USERNAME:admin}
    email: ${CHECKPOINT_ADMIN_EMAIL:admin@checkpoint.local}
    password: ${CHECKPOINT_ADMIN_PASSWORD:admin123}

logging:
  level:
    com.checkpoint: ${CHECKPOINT_LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${CHECKPOINT_SQL_LOG_LEVEL:DEBUG}
